<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Demo | ANSH Enterprises</title>
    <style>
        :root { color-scheme: light; font-family: Arial, sans-serif; color: #24324a; background: #f4f7fb; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
        main { width: min(680px, calc(100% - 40px)); padding: 40px; background: #fff; border: 1px solid #e5eaf2; border-radius: 16px; box-shadow: 0 16px 40px #1f355012; }
        .brand { color: #3459c5; font-size: .8rem; font-weight: 700; letter-spacing: .12em; }
        h1 { margin: 12px 0; font-size: clamp(2rem, 6vw, 3rem); }
        p { color: #66748a; line-height: 1.65; }
        a { display: inline-block; margin-top: 12px; padding: 11px 16px; border-radius: 8px; color: #fff; background: #3459c5; text-decoration: none; font-weight: 700; }
        a:hover { background: #253f9b; }
    </style>
</head>
<body>
    <main>
        <div class="brand">ANSH ENTERPRISES</div>
        <h1>Demo page</h1>
        <p>This is a standalone sample HTML page for the ANSH Enterprises portal.</p>
        <a href="/">Open the portal</a>
    </main>
</body>
</html>
